:root{--ink:#202a3b;--muted:#68758a;--line:#dce4ee;--wash:#f5f7fb;--blue:#3978ee}*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.page{padding:38px 44px 54px}.back{display:inline-flex;margin-bottom:19px;color:#63738c;text-decoration:none;font-size:13px}.back:hover{color:var(--blue)}.head,.meta,.map,.foot{width:min(1680px,100%);margin-left:auto;margin-right:auto}.head{display:flex;align-items:end;justify-content:space-between;gap:28px}.eyebrow{font:800 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;color:#6e7d95}.head h1{margin:9px 0 0;font-size:32px;line-height:1.2;letter-spacing:-.04em}.head p{max-width:510px;margin:0;color:var(--muted);text-align:right}.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.meta span{padding:6px 9px;border:1px solid #e0e6ee;border-radius:8px;background:#fff;color:#637187;font-size:12px}.map{margin-top:18px;overflow:auto;border:1px solid #dfe5ee;border-radius:22px;background:#fff;box-shadow:0 18px 42px -34px #263a5a}.map svg{display:block;min-width:1240px;width:100%;height:auto}.foot{margin-top:15px;color:var(--muted);font-size:12px}.foot b{color:#3c4c66}@media(max-width:900px){.page{padding:24px 18px 42px}.head{align-items:start;flex-direction:column;gap:10px}.head p{text-align:left}.head h1{font-size:27px}}

<body><main class="page"><a class="back" href="dact-CHI-研究材料总览.html">← 返回研究材料总览</a><header class="head"><div><div class="eyebrow">DACT · MODERATOR MIND MAP</div><h1>开发者—Agent 协同开发实作测试提纲</h1></div><p>主持人按分支推进访谈与连续工程，并记录开发者、Agent、知识资料和本地环境如何共同推进或中断任务。</p></header><div class="meta"><span>目标样本：约 20 名</span><span>单次时长：110–130 分钟</span><span>统一工程：AddCustom → PyTorch</span><span>实作环境：参与者自己的 IDE / CLI / Agent</span><span>连续节点：D → M → X → O → L</span></div><section class="map" aria-label="协同开发实作测试提纲思维导图"><svg id="outline" role="img" aria-label="协同开发实作测试提纲的思维导图"></svg></section><p class="foot"><b>两种活动：</b>绿色与橙色分支为访谈（真实项目回放、任务后解释与收束）；紫色分支为统一连续工程任务。金色分支是研究团队贯穿全程的记录、事件编码与分析准备。</p></main><script src="assets/vendor/d3.v7.9.0.min.js"></script><script>
const groups=[
 {id:'before',num:'01 · BEFORE',title:'开始与同意',time:'约 10 分钟',color:'#3978ee',soft:'#edf4ff',line:'#8bb4fb',items:[['同意','说明研究目的与流程；确认音频、屏幕、Agent 对话、终端和代码 diff 的同意范围。'],['背景','完成背景问卷：开发角色、经验、常用技术栈、AI Coding 使用方式与相关技术经验。'],['开场','确认参与者使用自己的 IDE、CLI、Agent 与公开资料；研究者记录过程与关键转折。']]},
 {id:'replay',num:'02 · INTERVIEW',title:'访谈 · 真实项目回放',time:'35–45 分钟',color:'#249d89',soft:'#eaf9f5',line:'#86d5c2',items:[['任务','选择一段近期 AI 协同开发任务：目标、完成标准、语言、版本、环境与项目约束。'],['轨迹','按时间回放：谁先发起？AI、资料、代码与本机环境怎样进入过程？'],['接管','追问转折：换问法、换来源、补充日志或版本信息、人工接管、验证、回退或停止。'],['证据','回看信任与证据：建议来自哪里？什么使参与者采纳、怀疑或回到真实环境核对？']]},
 {id:'task',num:'03 · TASK',title:'实作任务 · 连续工程',time:'50–60 分钟',color:'#9060d2',soft:'#f5efff',line:'#cdb4ef',items:[['D','写 Kernel：从 AddCustom 骨架出发，识别设备、dtype、format 等工程事实。'],['M','Tiling：围绕动态 shape、分块、尾块和 Tiling 信息推进，观察一般建议如何被约束具体化。'],['X','编译 / 内存：查看 launch 上下文与日志，记录如何补全上下文、回灌给 Agent、形成排查顺序。'],['O','注册接入：查看框架绑定、版本线索与测试输出，记录资料拼接、版本核对和人工接管。'],['L','精度验收：处理参考、阈值与交付边界，说明真实环境中仍需补充哪些验证证据。'],['主持','只提醒时间与记录范围；不解释答案、不替参与者操作、不预告版本组合或根因。']]},
 {id:'after',num:'04 · INTERVIEW',title:'访谈 · 回放与收束',time:'15–20 分钟 + 约 5 分钟',color:'#ed7a42',soft:'#fff2eb',line:'#f2bb99',items:[['回放','从 D 到 L 回看：AI 的角色在哪个节点变化？最早的接管、换源或要求证据由什么触发？'],['量表','围绕证据清晰度、现场核对、把握度、控制感与继续验证的可行性追问。'],['收束','回看官网、文档、样例和社区如何支撑开发者与 Agent 获取、判断和核对知识。']]},
 {id:'coding',num:'05 · RESEARCH',title:'研究团队记录与编码',time:'贯穿全程 + 访谈后',color:'#bd8b15',soft:'#fff8e3',line:'#e5cc72',items:[['事件','记录首次提问、外部来源、现场事实需求、回灌、接管、验证 checkpoint 与停止点。'],['材料','保留经同意的音频、屏幕、Agent 对话、终端输出、代码 diff、资料 URL 与参与者标记。'],['授权','任务后确认量表和匿名引用、后续澄清等授权选择；由研究团队按同意范围管理。'],['编码','访谈后按 D / M / X / O / L 编码协同轨迹，并结合真实项目回放形成机制解释。']]}
];
const W=1700, topicX=345, topicW=235, leafX=655, leafW=980, startY=48, leafH=54, leafGap=10, groupGap=30;
let y=startY; groups.forEach(g=>{g.height=Math.max(106,g.items.length*(leafH+leafGap)-leafGap);g.y=y;g.cy=y+g.height/2;g.leaves=g.items.map((d,i)=>({tag:d[0],text:d[1],y:y+i*(leafH+leafGap)}));y+=g.height+groupGap});
const H=y- groupGap + 56, root={x:38,w:250,h:126,cy:H/2,y:H/2-63}, spineX=304;
const svg=d3.select('#outline').attr('viewBox',`0 0 ${W} ${H}`).attr('width',W).attr('height',H);const links=svg.append('g').attr('fill','none').attr('stroke-linecap','round').attr('stroke-linejoin','round');
links.append('path').attr('d',`M${root.x+root.w},${root.cy}H${spineX}V${groups[0].cy}M${spineX},${groups[0].cy}V${groups.at(-1).cy}`).attr('stroke','#afbacb').attr('stroke-width',2);
groups.forEach(g=>{links.append('path').attr('d',`M${spineX},${g.cy}H${topicX}`).attr('stroke',g.color).attr('stroke-width',2);links.append('path').attr('d',`M${topicX+topicW},${g.cy}H${leafX-30}V${g.leaves[0].y+leafH/2}M${leafX-30},${g.leaves[0].y+leafH/2}V${g.leaves.at(-1).y+leafH/2}`).attr('stroke',g.color).attr('stroke-opacity',.72).attr('stroke-width',1.7);g.leaves.forEach(l=>links.append('path').attr('d',`M${leafX-30},${l.y+leafH/2}H${leafX}`).attr('stroke',g.color).attr('stroke-opacity',.72).attr('stroke-width',1.7));});
const rootG=svg.append('g').attr('transform',`translate(${root.x},${root.y})`);rootG.append('rect').attr('width',root.w).attr('height',root.h).attr('rx',19).attr('fill','#27334a');rootG.append('text').attr('x',22).attr('y',37).attr('fill','#fff').attr('font-size',21).attr('font-weight',800).text('DACT 实作测试');[['访谈：真实项目回放',65],['实作：连续工程任务',87],['访谈：任务后回放',109]].forEach(([t,yy])=>rootG.append('text').attr('x',22).attr('y',yy).attr('fill','#d8e2f4').attr('font-size',12).text(t));
groups.forEach(g=>{const t=svg.append('g').attr('transform',`translate(${topicX},${g.y+g.height/2-36})`);t.append('rect').attr('width',topicW).attr('height',72).attr('rx',15).attr('fill',g.soft).attr('stroke',g.color).attr('stroke-width',1.8);t.append('text').attr('x',15).attr('y',20).attr('fill',g.color).attr('font-size',11).attr('font-weight',800).text(g.num);t.append('text').attr('x',15).attr('y',43).attr('fill','#202a3b').attr('font-size',16).attr('font-weight',800).text(g.title);t.append('text').attr('x',15).attr('y',61).attr('fill','#68758a').attr('font-size',11).text(g.time);g.leaves.forEach(l=>{const n=svg.append('g').attr('transform',`translate(${leafX},${l.y})`);n.append('rect').attr('width',leafW).attr('height',leafH).attr('rx',11).attr('fill','#fcfcfd').attr('stroke',g.line);n.append('circle').attr('cx',17).attr('cy',27).attr('r',4).attr('fill',g.color);n.append('text').attr('x',30).attr('y',32).attr('fill','#27334a').attr('font-size',13).text(l.text);n.append('text').attr('x',leafW-16).attr('y',32).attr('text-anchor','end').attr('fill',g.color).attr('font-size',10).attr('font-weight',800).text(`〔${l.tag}〕`);});});
svg.selectAll('g').filter(function(){return d3.select(this).select('rect').size()&&d3.select(this).select('text').size()}).on('mouseenter',function(){d3.select(this).select('rect').attr('filter','drop-shadow(0 5px 7px rgba(34,56,87,.16))')}).on('mouseleave',function(){d3.select(this).select('rect').attr('filter',null)});
</script></body></html>
