<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AddCustom · 协同开发工作台</title>
<style>
:root{--bg:#111722;--panel:#181f2c;--panel2:#202938;--line:#334056;--ink:#e7edf7;--muted:#93a0b5;--blue:#6fa8ff;--teal:#56d6bd;--gold:#f0ba57;--red:#ff7b78;--violet:#a794ff;--code:#0d131d;--mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}*{box-sizing:border-box}body{margin:0;min-width:1060px;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}.top{height:58px;padding:0 20px;display:flex;align-items:center;gap:18px;border-bottom:1px solid var(--line);background:#151c28}.brand{font-weight:760;letter-spacing:.01em}.brand small{margin-left:9px;color:var(--muted);font-weight:500}.notice{color:var(--muted);font-size:12px;flex:1}.pill{font:12px var(--mono);padding:5px 9px;border:1px solid var(--line);border-radius:5px;color:var(--muted)}.layout{display:grid;grid-template-columns:225px minmax(470px,1fr) 330px;height:calc(100vh - 58px);min-height:680px}.left,.right{background:var(--panel);overflow:auto}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}.center{display:grid;grid-template-rows:auto minmax(265px,1fr) 280px;min-width:0}.section-title{padding:13px 15px 9px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font:11px var(--mono)}.flow{padding:10px 14px 14px;border-bottom:1px solid var(--line)}.flow h2{margin:0 0 6px;font-size:15px}.flow p{margin:0;color:var(--muted);font-size:12px}.stages{display:flex;padding:11px 14px 10px;gap:5px;background:var(--panel);border-bottom:1px solid var(--line)}.stage{flex:1;min-width:0;border:1px solid var(--line);padding:7px 8px;border-radius:5px;color:var(--muted);font-size:11px}.stage b{display:block;font:700 11px var(--mono);margin-bottom:2px}.stage.active{border-color:var(--blue);background:#1b2d48;color:#dbeaff}.stage.done{border-color:#337d71;color:#9ce2d4}.tree{font-family:var(--mono);font-size:12px;padding:5px 8px}.folder,.file{padding:5px 7px;border-radius:4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.folder{color:#c8d3e4}.file{padding-left:23px;color:#aebbd0}.file:before{content:'› ';color:#677894}.file:hover,.file.sel{background:#293750;color:#fff}.workspace-head{display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}.workspace-head h1{font:600 13px var(--mono);margin:0;padding:12px 0}.dirty{font:11px var(--mono);color:var(--gold)}.editor-wrap{position:relative;min-height:0;background:var(--code)}.lines{position:absolute;left:0;top:0;bottom:0;width:45px;padding:14px 9px;text-align:right;color:#536177;font:12px/1.65 var(--mono);user-select:none;border-right:1px solid #273247}.editor{position:absolute;inset:0 0 0 45px;border:0;outline:0;resize:none;background:transparent;color:#dfe8f5;padding:14px 16px;font:12px/1.65 var(--mono);white-space:pre;tab-size:2}.hintbar{display:flex;justify-content:space-between;align-items:center;padding:7px 14px;background:#151d2a;border-top:1px solid #273247;color:var(--muted);font:11px var(--mono)}.terminal{border-top:1px solid var(--line);background:#0c1119;display:grid;grid-template-rows:auto 1fr auto;min-height:0}.term-title{padding:8px 14px;color:#b9c6d8;font:12px var(--mono);border-bottom:1px solid #202b3d}.output{overflow:auto;padding:12px 14px;font:12px/1.62 var(--mono);white-space:pre-wrap;color:#d4deed}.out-muted{color:#8695aa}.out-ok{color:#6fe2c9}.out-warn{color:#ffd17c}.out-err{color:#ff938d}.cmdrow{display:flex;gap:9px;align-items:center;padding:9px 13px;border-top:1px solid #202b3d;font:12px var(--mono)}.prompt{color:var(--teal)}#command{flex:1;background:transparent;border:0;outline:0;color:#eef5ff;font:inherit}.right section{padding:0 14px 15px;border-bottom:1px solid var(--line)}.right h3{font-size:13px;margin:0;padding:13px 0 5px}.right p{margin:0;color:var(--muted);font-size:12px}.fact{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #344056;font-size:12px}.fact span:last-child{font-family:var(--mono);color:var(--gold)}textarea{width:100%;min-height:98px;background:#111824;color:#dce5f4;border:1px solid var(--line);border-radius:5px;padding:9px;resize:vertical;font:12px/1.5 var(--mono)}button{border:1px solid #40516d;border-radius:5px;background:#293a58;color:#e7f0ff;padding:7px 9px;cursor:pointer;font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button:hover{background:#36517a}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.log{max-height:180px;overflow:auto;font:11px/1.55 var(--mono);color:#b8c6d9}.log div{padding:5px 0;border-bottom:1px dashed #344056}.log time{color:#63728a}.status{padding:9px 14px;background:#1a2433;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.status b{color:#d8e4f7}.hidden{display:none}@media(max-width:1100px){body{min-width:0}.layout{grid-template-columns:190px 1fr 280px}.notice{display:none}}
</style>
</head>
<body>
<header class="top"><div class="brand">AddCustom <small>协同开发工作台</small></div><div class="notice">预置开发环境：终端输出是研究情境中的运行记录，不连接真实 NPU。</div><span class="pill" id="phasePill">D · 写 Kernel</span></header>
<main class="layout">
  <aside class="left"><div class="section-title">Explorer</div><div class="flow"><h2>AddCustom</h2><p>Ascend C custom operator → PyTorch</p></div><div class="tree" id="tree"></div></aside>
  <section class="center">
    <div><div class="stages" id="stages"></div><div class="workspace-head"><h1 id="fileName">op_kernel/add_custom.cpp</h1><span class="dirty" id="dirty"></span></div></div>
    <div class="editor-wrap"><div class="lines" id="lines"></div><textarea class="editor" id="editor" spellcheck="false"></textarea></div>
    <div class="terminal"><div class="term-title">TERMINAL · 输入 <code>help</code> 查看可用命令</div><div class="output" id="output"></div><form class="cmdrow" id="form"><span class="prompt">addcustom $</span><input id="command" autocomplete="off" autofocus placeholder="例如：build 或 npu-smi info"></form></div>
  </section>
  <aside class="right">
    <section><div class="section-title">当前节点</div><h3 id="stageName">D · 写 Kernel</h3><p id="stageDesc"></p></section>
    <section><h3>已发现的现场事实</h3><div id="facts"></div></section>
    <section><h3>外部 AI 对话记录</h3><p>请在指定 AI 工具中实际提问；这里只记录关键输入、来源和你的决定。</p><textarea id="aiNote" placeholder="例如：向 Agent 询问了 msopgen 的工程生成方式；它引用了……；我决定……"></textarea><div class="actions"><button type="button" id="saveNote">记录本次交接</button><button type="button" id="export">导出过程记录</button></div></section>
    <section><h3>操作轨迹</h3><div class="log" id="log"></div></section>
    <div class="status" id="status"><b>状态：</b>从工程骨架开始。可以先查看文件或输入 <code>help</code>。</div>
  </aside>
</main>
<script>
const S=[
 {id:'D',name:'D · 写 Kernel',desc:'从 AddCustom 工程骨架开始，确定工程路线与必须从环境确认的事实。',cmd:'npu-smi info',need:'需要先获得目标 SoC 信息，才能生成可靠的工程配置。'},
 {id:'M',name:'M · Tiling',desc:'基础 kernel 已有起点；现在面对动态 shape 与 Tiling 约束。',cmd:'test --shape dynamic',need:'先查看动态 shape 的运行线索。'},
 {id:'X',name:'X · 编译 / 内存',desc:'预置运行记录出现潜在越界线索。请收集上下文，而不是直接猜根因。',cmd:'sanitize --shape 65537',need:'先运行内存检查，获取需要回灌的证据。'},
 {id:'O',name:'O · 注册接入',desc:'算子需要在 PyTorch 一侧完成注册和版本核对。',cmd:'python torch_test.py',need:'先执行框架调用测试，确认接入状态。'},
 {id:'L',name:'L · 精度验收',desc:'根据比对线索建立验证与交付边界。',cmd:'accuracy_test --shape 65537',need:'先查看边界 shape 下的精度线索。'}
];
const files={
 'op_kernel/add_custom.cpp':`#include "kernel_operator.h"\n\nextern "C" __global__ void add_custom(GM_ADDR x, GM_ADDR y, GM_ADDR z) {\n  // TODO: CopyIn → Compute → CopyOut\n  // TODO: TilingData / tail handling\n  // TODO: use the launch configuration supplied by host\n}`,
 'op_host/add_custom.cpp':`#include "add_custom_tiling.h"\n\n// Host-side skeleton. The real launch configuration depends on\n// soc_version, input shape, dtype/format and blockDim.\nvoid AddCustomHost(/* runtime handles omitted */) {\n  // TODO: create tiling data and launch kernel\n}`,
 'op_host/add_custom_tiling.h':`struct AddCustomTilingData {\n  uint32_t totalLength;\n  uint32_t blockLength;\n  uint32_t tileLength;\n  uint32_t tailLength;\n};`,
 'framework/torch_extension.cpp':`#include <torch/extension.h>\n\n// Registration is intentionally incomplete.\n// TODO: decide dispatcher / binding route after checking versions.\n\n// TORCH_LIBRARY(addcustom, m) {\n//   m.def("add(Tensor x, Tensor y) -> Tensor");\n// }`,
 'tests/torch_test.py':`import torch\n# import torch_npu\n\n# Future intent: torch.ops.addcustom.add(x, y)\n# Actual versions, ABI and registration state are not fixed in this workspace.`,
 'environment.md':`Known: Ascend C custom operator; AddCustom(x, y) -> z; fp16 ND.\n\nUnknown and must be checked in the target environment:\n- NPU model / soc_version\n- CANN, driver and firmware versions\n- PyTorch / torch_npu compatibility\n- real input shape, dtype, format and acceptance threshold`
};
let stage=0, active='op_kernel/add_custom.cpp', modified=false;
const facts={}, events=[];
const $=id=>document.getElementById(id);
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function now(){return new Date().toLocaleTimeString('zh-CN',{hour12:false})}
function event(type,detail){events.push({time:new Date().toISOString(),stage:S[stage].id,type,detail});renderLog()}
function out(text,kind=''){const d=document.createElement('div');d.className=kind;d.textContent=text;$('output').append(d);$('output').scrollTop=$('output').scrollHeight}
function renderTree(){const folders=[['op_kernel',['op_kernel/add_custom.cpp']],['op_host',['op_host/add_custom.cpp','op_host/add_custom_tiling.h']],['framework',['framework/torch_extension.cpp']],['tests',['tests/torch_test.py']],['project',['environment.md']]];$('tree').innerHTML=folders.map(([f,fs])=>`<div class="folder">⌄ ${f}</div>${fs.map(x=>`<div class="file ${x===active?'sel':''}" data-file="${x}">${x.split('/').at(-1)}</div>`).join('')}`).join('');document.querySelectorAll('.file').forEach(x=>x.onclick=()=>openFile(x.dataset.file))}
function openFile(f){active=f;$('fileName').textContent=f;$('editor').value=files[f];modified=false;$('dirty').textContent='';lines();renderTree();event('open_file',f)}
function lines(){const n=$('editor').value.split('\n').length;$('lines').textContent=Array.from({length:n},(_,i)=>i+1).join('\n')}
function renderStages(){$('stages').innerHTML=S.map((s,i)=>`<div class="stage ${i<stage?'done':i===stage?'active':''}"><b>${s.id}</b>${s.name.split(' · ')[1]}</div>`).join('');$('phasePill').textContent=S[stage].name;$('stageName').textContent=S[stage].name;$('stageDesc').textContent=S[stage].desc}
function renderFacts(){$('facts').innerHTML=Object.keys(facts).length?Object.entries(facts).map(([k,v])=>`<div class="fact"><span>${esc(k)}</span><span>${esc(v)}</span></div>`).join(''):'<p>尚未发现。运行命令、查看文件或记录外部 AI 对话后会出现在这里。</p>'}
function renderLog(){$('log').innerHTML=events.slice(-20).reverse().map(e=>`<div><time>${e.time.slice(11,19)}</time> · ${e.stage} · ${esc(e.type)}<br>${esc(e.detail)}</div>`).join('')}
function setFact(k,v){facts[k]=v;renderFacts();event('fact',`${k}: ${v}`)}
function setStatus(t){$('status').innerHTML='<b>状态：</b>'+t}
function advance(){if(stage<S.length-1){stage++;renderStages();setStatus(`已进入 <b>${S[stage].name}</b>。${S[stage].need}`)}else setStatus('五个节点已走完。请记录最终验证边界，并导出过程记录。')}
function help(){out('可用命令：\n  ls | cat <file> | status | npu-smi info\n  build | test --shape dynamic | sanitize --shape 65537\n  inspect launch | python torch_test.py | check versions\n  register torch | accuracy_test --shape 65537\n  checkpoint <你的验证边界>\n\n提示：命令的返回是预置情境线索；可随时编辑文件、查看资料或在外部 Agent 中提问。','out-muted')}
function run(raw){const cmd=raw.trim();if(!cmd)return;out('addcustom $ '+cmd,'out-muted');event('command',cmd);const e=$('editor');if(cmd==='help')return help();if(cmd==='ls')return out('op_kernel/\nop_host/\nframework/\ntests/\nenvironment.md');if(cmd.startsWith('cat ')){const f=cmd.slice(4).trim();if(files[f]){openFile(f);return out(`opened ${f}`,'out-ok')}return out(`cat: ${f}: no such file`,'out-err')}if(cmd==='status'){return out(`stage=${S[stage].id}\nknown facts=${Object.keys(facts).length||0}\ncurrent file=${active}`)}
 if(cmd==='npu-smi info'){setFact('目标设备','Ascend910B1（预置设备快照）');setFact('soc_version','Ascend910B1');out('NPU 0\n  Name: Ascend910B1\n  soc_version: Ascend910B1\n  Driver/CANN details: not included in this snapshot','out-ok');if(stage===0)setStatus('已获得设备事实。现在可检查工程配置或执行 <code>build</code>。');return}
 if(cmd==='build'){if(stage===0&&!facts.soc_version){out('error: target ai_core_<soc_version> is unresolved\nhint: the project needs a device fact before generation/build.','out-err');setStatus('构建被环境事实阻断：需要目标 SoC。可运行 <code>npu-smi info</code>，也可在外部 Agent 中询问该事实的用途。');return}if(stage===0){out('generated project configuration for ai_core_Ascend910B1\ncompile plan accepted; kernel implementation remains to be validated in a real runtime.','out-ok');event('checkpoint','Kernel route configured with soc_version');advance();return}if(stage===1){out('build: static path accepted\nwarning: dynamic-shape tiling metadata remains unresolved.','out-warn');setStatus('静态路径已通过检查；请用 <code>test --shape dynamic</code> 查看动态输入线索。');return}out('build: no new simulated output for this stage. Use <code>help</code> to continue.');return}
 if(cmd==='test --shape dynamic'){if(stage!==1){out('test: dynamic-shape scenario is not active yet.','out-warn');return}setFact('动态输入','N may not divide evenly by block');out('test --shape dynamic\nerror: tiling metadata missing for shape=[N]\ncontext required: totalLength, blockDim, tileLength, tailLength','out-err');setStatus('请查看 Tiling 相关文件/资料，或向外部 Agent 询问哪些字段应由 host 和 kernel 共同处理。');return}
 if(cmd==='configure tiling --dynamic'){if(stage!==1){out('configure: Tiling stage is not active.','out-warn');return}setFact('Tiling checkpoint','需要 totalLength / blockDim / tileLength / tailLength');out('tiling configuration saved\nnext: validate a boundary shape and retain launch context.','out-ok');event('checkpoint','dynamic tiling configuration');advance();return}
 if(cmd==='sanitize --shape 65537'){if(stage!==2){out('sanitize: memory stage is not active.','out-warn');return}out('msSanitizer summary\n  invalid global-memory access near AddCustom kernel launch\n  input length and block configuration are absent from this excerpt\n  root cause cannot be identified from this log alone.','out-err');setStatus('不要直接猜根因。可运行 <code>inspect launch</code> 补充现场上下文，再决定排查顺序。');return}
 if(cmd==='inspect launch'){if(stage!==2){out('inspect: launch context is only available in the memory stage.','out-warn');return}setFact('launch context','shape=65537, blockDim=32, tail=1');out('launch context\n  shape=[65537]\n  blockDim=32\n  final tile has a 1-element tail\n  dtype=float16, format=ND','out-ok');return}
 if(cmd==='sanitize --shape 65537 --with-launch-context'){if(stage!==2){out('sanitize: memory stage is not active.','out-warn');return}if(!facts['launch context']){out('missing context: run <code>inspect launch</code> first.','out-err');return}out('sanitizer re-run prepared\ncheckpoint: verify tail handling against TilingData before claiming the access is fixed.','out-ok');event('checkpoint','memory boundary validation');advance();return}
 if(cmd==='python torch_test.py'){if(stage!==3){out('python: framework integration stage is not active.','out-warn');return}out('Traceback (most recent call last):\n  AttributeError: namespace \'addcustom\' has no attribute \'add\'\nHint: registration/binding and version compatibility are not established.','out-err');setStatus('接入尚未完成。可查看 <code>framework/torch_extension.cpp</code>，运行 <code>check versions</code> 或向外部 Agent 询问注册路径。');return}
 if(cmd==='check versions'){if(stage!==3){out('check: version check is only available in the integration stage.','out-warn');return}setFact('版本边界','PyTorch 2.x / torch_npu / CANN 小版本与 ABI 待核对');out('version check\n  PyTorch: 2.x (minor version not locked)\n  torch_npu: not locked\n  CANN: not locked\n  conclusion: do not assume ABI compatibility.','out-warn');return}
 if(cmd==='register torch'){if(stage!==3){out('register: framework integration stage is not active.','out-warn');return}out('registration route recorded\ncheckpoint: verify dispatcher symbol, build artifact and exact version matrix in the target environment.','out-ok');event('checkpoint','PyTorch registration and compatibility');advance();return}
 if(cmd==='accuracy_test --shape 65537'){if(stage!==4){out('accuracy_test: accuracy stage is not active.','out-warn');return}setFact('精度边界','dynamic shape [65537] needs reference output and acceptance threshold');out('accuracy_test --shape 65537\nreference output: unavailable in this workspace\nobserved risk: tail handling and dtype conversion may affect boundary values\nacceptance threshold: not supplied by project owner.','out-warn');setStatus('精度不能只凭通用建议判定。请用 <code>checkpoint ...</code> 记录真实交付前必须确认的阈值或验证。');return}
 if(cmd.startsWith('checkpoint ')){const note=cmd.slice(11).trim();if(!note){out('checkpoint: add a short verification boundary after the command.','out-warn');return}setFact(`checkpoint ${Object.keys(facts).filter(k=>k.startsWith('checkpoint')).length+1}`,note);out('verification checkpoint recorded.','out-ok');event('checkpoint',note);if(stage===4)advance();return}
 out(`command not recognized: ${cmd}\nType help to see available commands.`,'out-err')}
$('form').addEventListener('submit',e=>{e.preventDefault();const v=$('command').value;run(v);$('command').value=''});
$('editor').addEventListener('input',()=>{files[active]=$('editor').value;modified=true;$('dirty').textContent='● modified';lines();event('edit',active)});
$('saveNote').onclick=()=>{const n=$('aiNote').value.trim();if(!n)return;$('aiNote').value='';event('agent_handoff',n);setStatus('已记录外部 AI 交接。继续操作或在适当时机导出过程记录。')};
$('export').onclick=()=>{const data={study:'DACM AddCustom simulated workbench',exportedAt:new Date().toISOString(),finalStage:S[stage].id,facts,events,files};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=`dacm-${S[stage].id}-record.json`;a.click();URL.revokeObjectURL(a.href);event('export','local JSON record')};
renderTree();openFile(active);renderStages();renderFacts();out('AddCustom simulated development workspace\nType help to list commands.\n','out-muted');
</script>
</body></html>
